<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sodovkárna - Admin Panel</title>
    <link rel="stylesheet" href="style.css"> <!-- Reuse glass styles -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* Specific Admin Styles */
        .admin-login {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .admin-table-container {
            max-height: 400px;
            /* Scrollable */
            overflow-y: auto;
            margin-top: 1rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            color: var(--text-light);
            text-align: left;
        }

        th,
        td {
            padding: 12px;
            border-bottom: 1px solid var(--glass-border);
        }

        th {
            background: rgba(255, 255, 255, 0.05);
            font-weight: 700;
        }

        .hidden {
            display: none;
        }

        .error {
            color: #e57373;
            margin-top: 0.5rem;
            display: none;
        }

        /* Modal Styles */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal.show {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            width: 90%;
            max-width: 500px;
            padding: 2.5rem;
            position: relative;
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-light);
            opacity: 0.7;
        }

        .modal-close:hover {
            opacity: 1;
        }

        .modal-detail-item {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        .modal-detail-label {
            font-weight: 700;
            color: var(--accent);
            text-transform: uppercase;
            font-size: 0.8rem;
            margin-bottom: 0.3rem;
        }

        .modal-detail-value {
            font-size: 1.1rem;
            line-height: 1.5;
        }

        tr.clickable {
            cursor: pointer;
            transition: background 0.2s ease;
        }

        tr.clickable:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .question-row {
            background: rgba(255, 255, 255, 0.05);
            padding: 1rem;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            transition: transform 0.2s ease, background 0.2s ease;
        }

        .question-row:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: translateY(-2px);
        }

        .question-row input[type="text"] {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--glass-border);
            color: var(--text-light);
            padding: 10px 15px;
            border-radius: 8px;
            font-family: inherit;
        }

        .question-row input[type="text"]:focus {
            outline: none;
            border-color: var(--accent);
            background: rgba(255, 255, 255, 0.15);
        }

        .welcome-text {
            font-size: 3rem;
            font-weight: 700;
            color: var(--accent);
            animation: fadeInOut 2s ease-in-out forwards;
        }

        @keyframes fadeInOut {
            0% {
                opacity: 0;
                transform: translateY(20px);
            }

            20% {
                opacity: 1;
                transform: translateY(0);
            }

            80% {
                opacity: 1;
                transform: translateY(0);
            }

            100% {
                opacity: 0;
                transform: translateY(-20px);
            }
        }
    </style>
</head>

<body>
    <div class="background-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
    </div>

    <main class="container" style="max-width: 800px;">
        <div class="card glass">
            <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px;">
                <div>
                    <span
                        style="font-size: 0.75rem; text-transform: uppercase; letter-spacing: 2px; opacity: 0.6; font-weight: 700;">Admin
                        Panel</span>
                    <h1 style="margin: 0; color: var(--accent); font-size: 1.6rem;">Sodovkárna</h1>
                </div>
                <a href="/"
                    style="text-decoration: none; color: var(--text-dark); background: rgba(255,255,255,0.2); padding: 8px 16px; border-radius: 20px; font-weight: 500;">&larr;
                    Zpět do aplikace</a>
            </div>

            <!-- Login State -->
            <div id="loginState" class="admin-login" style="text-align: center;">
                <h3 style="margin-bottom: 20px; opacity: 0.8;">Přihlášení - Sodovkárna</h3>
                <input type="password" id="passwordInput" placeholder="Heslo" />
                <button id="loginBtn">Přihlásit se</button>
                <div id="errorMsg" class="error">Nesprávné heslo</div>
            </div>

            <!-- Welcome State -->
            <div id="welcomeState" class="hidden" style="text-align: center; padding: 3rem 0;">
                <h2 class="welcome-text">Zdravíčko! 👋</h2>
            </div>

            <!-- Dashboard State -->
            <div id="dashboardState" class="hidden">
                <div style="text-align: left; margin-bottom: 2rem; display: flex; flex-wrap: wrap; gap: 2rem;">
                    <div class="stat-card"
                        style="background: rgba(255,255,255,0.03); padding: 1.5rem; border-radius: 16px; min-width: 160px; border: 1px solid var(--glass-border);">
                        <span
                            style="opacity: 0.5; font-size: 0.8rem; text-transform: uppercase; font-weight: 700; letter-spacing: 1px;">Odpovědi</span>
                        <div id="totalAnswers" style="font-size: 2.5rem; font-weight: 700; color: var(--accent);">0
                        </div>
                    </div>
                    <div class="stat-card"
                        style="background: rgba(255,255,255,0.03); padding: 1.5rem; border-radius: 16px; min-width: 160px; border: 1px solid var(--glass-border);">
                        <span
                            style="opacity: 0.5; font-size: 0.8rem; text-transform: uppercase; font-weight: 700; letter-spacing: 1px;">Kupóny</span>
                        <div id="totalCoupons" style="font-size: 2.5rem; font-weight: 700; color: #81c784;">0</div>
                    </div>
                </div>
                <!-- Navigation -->
                <div class="nav-tabs"
                    style="display: flex; gap: 10px; margin-bottom: 2rem; border-bottom: 1px solid var(--glass-border); padding-bottom: 10px;">
                    <button id="viewFeedbackBtn" class="nav-btn active"
                        style="padding: 10px 20px; font-size: 1rem; background: rgba(255,255,255,0.1); border: none; border-radius: 10px; cursor: pointer; color: var(--text-light);">Odpovědi</button>
                    <button id="viewStatsBtn" class="nav-btn"
                        style="padding: 10px 20px; font-size: 1rem; background: transparent; border: none; border-radius: 10px; cursor: pointer; color: var(--text-light);">Grafy
                        & Statistiky</button>
                    <button id="viewCouponsBtn" class="nav-btn"
                        style="padding: 10px 20px; font-size: 1rem; background: transparent; border: none; border-radius: 10px; cursor: pointer; color: var(--text-light);">Správa
                        kupónů</button>
                    <button id="viewQuestionsBtn" class="nav-btn"
                        style="padding: 10px 20px; font-size: 1rem; background: transparent; border: none; border-radius: 10px; cursor: pointer; color: var(--text-light);">Nastavení</button>
                </div>

                <!-- Stats View -->
                <div id="statsView" class="hidden">
                    <div id="statsGrid"
                        style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px;">
                        <!-- Question Charts will be injected here -->
                    </div>
                </div>

                <!-- Feedback View -->
                <div id="feedbackView" class="admin-table-container">
                    <div style="display: flex; gap: 10px; margin-bottom: 1.5rem; flex-wrap: wrap;">
                        <button id="deleteAllBtn"
                            style="background: rgba(229, 115, 115, 0.1); color: #e57373; border: 1px solid rgba(229, 115, 115, 0.2); padding: 8px 16px; border-radius: 10px; cursor: pointer; font-size: 0.9rem;">🔥🔥
                            Smazat ÚPLNĚ VŠE</button>
                    </div>
                    <table id="dataTable">
                        <thead>
                            <tr>
                                <th>Datum</th>
                                <th>Čas</th>
                                <th>Odpověď</th>
                                <th>Kupón?</th>
                                <th>Text (Q1)</th>
                                <th>Akce</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody">
                            <!-- Rows -->
                        </tbody>
                    </table>
                </div>

                <!-- Coupon View -->
                <div id="couponView" class="admin-table-container hidden">
                    <div style="margin-bottom: 2rem; display: flex; gap: 10px;">
                        <input type="text" id="newCouponCode" placeholder="Kód (např. KAVA10)" style="flex: 1;">
                        <input type="text" id="newCouponValue" placeholder="Hodnota (např. Sleva 10%)" style="flex: 2;">
                        <button id="addCouponBtn"
                            style="background: var(--accent); color: var(--text-dark); border: none; padding: 10px 20px; border-radius: 10px; cursor: pointer; font-weight: 700;">Přidat</button>
                    </div>
                    <table id="couponTable">
                        <thead>
                            <tr>
                                <th>Kód</th>
                                <th>Hodnota</th>
                                <th>Stav</th>
                                <th>Akce</th>
                            </tr>
                        </thead>
                        <tbody id="couponTableBody">
                            <!-- Coupon Rows -->
                        </tbody>
                    </table>
                </div>

                <!-- Questions View -->
                <div id="questionsView" class="admin-table-container hidden">
                    <div id="questionsList"
                        style="display: flex; flex-direction: column; gap: 1rem; margin-bottom: 2rem;">
                        <!-- Dynamic Question Inputs -->
                    </div>
                    <div style="display: flex; gap: 10px;">
                        <button id="addQuestionBtn"
                            style="background: rgba(255,255,255,0.1); color: white; border: none; padding: 10px 20px; border-radius: 10px; cursor: pointer;">+
                            Přidat otázku</button>
                        <button id="saveQuestionsBtn"
                            style="background: var(--accent); color: var(--text-dark); border: none; padding: 10px 20px; border-radius: 10px; cursor: pointer; font-weight: 700;">Uložit
                            změny</button>
                    </div>
                </div>

            </div> <!-- End Dashboard State -->

            <button id="logoutBtn"
                style="margin-top: 20px; background: transparent; border: 1px solid var(--glass-border);">Logout</button>
        </div>
        </div>
    </main>

    <!-- Detail Modal -->
    <div id="detailModal" class="modal">
        <div class="card glass modal-content">
            <span class="modal-close" id="closeModal">&times;</span>
            <h2 style="margin-bottom: 2rem;">Feedback Detail</h2>

            <div class="modal-detail-item">
                <div class="modal-detail-label">DateTime</div>
                <div id="modalDateTime" class="modal-detail-value"></div>
            </div>

            <div class="modal-detail-item">
                <div class="modal-detail-label">Coffee Rating</div>
                <div id="modalAnswer" class="modal-detail-value"></div>
            </div>

            <div class="modal-detail-item">
                <div class="modal-detail-label">Reason for "NE"</div>
                <div id="modalReason" class="modal-detail-value"></div>
            </div>

            <div class="modal-detail-item">
                <div class="modal-detail-label">Service Note</div>
                <div id="modalService" class="modal-detail-value"></div>
            </div>

            <div class="modal-detail-item" id="modalCouponContainer">
                <div class="modal-detail-label">Issued Coupon</div>
                <div id="modalCoupon" class="modal-detail-value"
                    style="font-family: monospace; letter-spacing: 2px; font-weight: 700; color: var(--accent);"></div>
            </div>
        </div>
    </div>

    <script>
        const loginState = document.getElementById('loginState');
        const dashboardState = document.getElementById('dashboardState');
        const passwordInput = document.getElementById('passwordInput');
        const loginBtn = document.getElementById('loginBtn');
        const errorMsg = document.getElementById('errorMsg');
        const tableBody = document.getElementById('tableBody');
        const logoutBtn = document.getElementById('logoutBtn');
        const couponTableBody = document.getElementById('couponTableBody');
        const feedbackView = document.getElementById('feedbackView');
        const couponView = document.getElementById('couponView');
        const viewFeedbackBtn = document.getElementById('viewFeedbackBtn');
        const viewCouponsBtn = document.getElementById('viewCouponsBtn');
        const viewQuestionsBtn = document.getElementById('viewQuestionsBtn');
        const questionsView = document.getElementById('questionsView');
        const questionsList = document.getElementById('questionsList');
        const addQuestionBtn = document.getElementById('addQuestionBtn');
        const saveQuestionsBtn = document.getElementById('saveQuestionsBtn');

        const newCouponCode = document.getElementById('newCouponCode');
        const newCouponValue = document.getElementById('newCouponValue');
        const addCouponBtn = document.getElementById('addCouponBtn');

        // Modal Elements
        const detailModal = document.getElementById('detailModal');
        const closeModal = document.getElementById('closeModal');
        const modalDateTime = document.getElementById('modalDateTime');
        const modalAnswer = document.getElementById('modalAnswer');
        const modalReason = document.getElementById('modalReason');
        const modalService = document.getElementById('modalService');
        const modalCoupon = document.getElementById('modalCoupon');
        const modalCouponContainer = document.getElementById('modalCouponContainer');

        const totalAnswersEl = document.getElementById('totalAnswers');
        const totalCouponsEl = document.getElementById('totalCoupons');

        let allData = [];

        const viewStatsBtn = document.getElementById('viewStatsBtn');
        const statsView = document.getElementById('statsView');
        const statsGrid = document.getElementById('statsGrid');

        loginBtn.addEventListener('click', attemptLogin);
        passwordInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') attemptLogin() });
        logoutBtn.addEventListener('click', () => location.reload());

        viewFeedbackBtn.addEventListener('click', () => switchView('feedback'));
        viewStatsBtn.addEventListener('click', () => switchView('stats'));
        viewCouponsBtn.addEventListener('click', () => switchView('coupons'));
        viewQuestionsBtn.addEventListener('click', () => switchView('questions'));
        addCouponBtn.addEventListener('click', addCoupon);
        addQuestionBtn.addEventListener('click', () => addQuestionRow());
        saveQuestionsBtn.addEventListener('click', saveQuestions);

        document.getElementById('deleteAllBtn').addEventListener('click', deleteAllFeedback);

        function switchView(view) {
            feedbackView.classList.toggle('hidden', view !== 'feedback');
            statsView.classList.toggle('hidden', view !== 'stats');
            couponView.classList.toggle('hidden', view !== 'coupons');
            questionsView.classList.toggle('hidden', view !== 'questions');

            viewFeedbackBtn.style.background = view === 'feedback' ? 'rgba(255,255,255,0.1)' : 'transparent';
            viewStatsBtn.style.background = view === 'stats' ? 'rgba(255,255,255,0.1)' : 'transparent';
            viewCouponsBtn.style.background = view === 'coupons' ? 'rgba(255,255,255,0.1)' : 'transparent';
            viewQuestionsBtn.style.background = view === 'questions' ? 'rgba(255,255,255,0.1)' : 'transparent';

            if (view === 'coupons') fetchCoupons();
            if (view === 'questions') fetchQuestions();
            if (view === 'stats') renderStats();
        }

        async function fetchCoupons() {
            const password = passwordInput.value;
            try {
                const response = await fetch('/api/admin/coupons', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });
                if (response.ok) {
                    const coupons = await response.json();
                    renderCouponTable(coupons);
                }
            } catch (e) {
                console.error(e);
            }
        }

        async function fetchQuestions() {
            try {
                const response = await fetch('/api/questions');
                if (response.ok) {
                    const questions = await response.json();
                    renderQuestions(questions);
                }
            } catch (e) { console.error(e); }
        }

        async function renderStats() {
            statsGrid.innerHTML = 'Načítání grafů...';
            try {
                const qRes = await fetch('/api/questions');
                const questions = await qRes.json();

                statsGrid.innerHTML = '';

                questions.forEach(q => {
                    const canvasId = `chart-${q.id}`;
                    const card = document.createElement('div');
                    card.className = 'glass';
                    card.style.padding = '20px';
                    card.style.borderRadius = '20px';
                    card.innerHTML = `
                        <h4 style="margin-bottom: 15px; font-size: 1rem; opacity: 0.8;">${q.text}</h4>
                        <div style="height: 200px; position: relative;">
                            <canvas id="${canvasId}"></canvas>
                        </div>
                    `;
                    statsGrid.appendChild(card);

                    const ctx = document.getElementById(canvasId).getContext('2d');

                    // Aggregate data
                    const counts = {};
                    allData.forEach(entry => {
                        const resp = entry.responses?.[q.id]?.answer;
                        if (resp !== undefined && resp !== null && resp !== "") {
                            counts[resp] = (counts[resp] || 0) + 1;
                        }
                    });

                    const labels = Object.keys(counts);
                    const values = Object.values(counts);

                    if (labels.length === 0) {
                        document.getElementById(canvasId).parentElement.innerHTML = '<p style="text-align:center; padding-top: 80px; opacity: 0.4;">Zatím žádná data</p>';
                        return;
                    }

                    new Chart(ctx, {
                        type: q.type === 'stars' ? 'bar' : 'pie',
                        data: {
                            labels: labels,
                            datasets: [{
                                data: values,
                                backgroundColor: [
                                    '#C08261', '#8d6e63', '#5d4037', '#F5E6D3', '#FFF4E0'
                                ],
                                borderWidth: 0
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                legend: {
                                    display: q.type !== 'stars',
                                    position: 'bottom',
                                    labels: { color: 'rgba(255,255,255,0.7)', font: { family: 'Outfit' } }
                                }
                            },
                            scales: q.type === 'stars' ? {
                                y: { beginAtZero: true, ticks: { color: 'rgba(255,255,255,0.5)' }, grid: { color: 'rgba(255,255,255,0.1)' } },
                                x: { ticks: { color: 'rgba(255,255,255,0.5)' }, grid: { display: false } }
                            } : {}
                        }
                    });
                });
            } catch (e) {
                console.error(e);
                statsGrid.innerHTML = 'Chyba při načítání statistik.';
            }
        }

        function renderQuestions(questions) {
            questionsList.innerHTML = '';
            questions.forEach(q => addQuestionRow(q));
        }

        function addQuestionRow(q = { id: Date.now().toString(), text: '', allowNote: true, yesPrompt: 'Máte pro nás nějaký postřeh? ✨', noPrompt: 'Mrzí nás to. 😔 Chcete nám říct proč?' }) {
            const div = document.createElement('div');
            div.className = 'question-row';
            div.dataset.id = q.id;
            div.style.display = 'flex';
            div.style.flexDirection = 'column';
            div.style.gap = '15px';
            div.style.position = 'relative';

            div.innerHTML = `
                <div style="display: flex; gap: 15px; align-items: flex-end;">
                    <div style="flex: 1; display: flex; flex-direction: column; gap: 5px;">
                        <span style="font-size: 0.8rem; opacity: 0.6; text-transform: uppercase; font-weight: 700; letter-spacing: 1px;">Otázka</span>
                        <input type="text" class="question-text" value="${q.text}" placeholder="Vepište text otázky..." style="width: 100%;">
                    </div>
                    <div style="display: flex; flex-direction: column; gap: 5px;">
                        <span style="font-size: 0.8rem; opacity: 0.6; text-transform: uppercase; font-weight: 700; letter-spacing: 1px;">Typ</span>
                        <select class="type-select" style="height: 38px; border-radius: 8px; background: rgba(255,255,255,0.1); color: white; border: 1px solid var(--glass-border); padding: 0 10px;">
                            <option value="yes_no" ${q.type === 'yes_no' ? 'selected' : ''}>ANO / NE</option>
                            <option value="stars" ${q.type === 'stars' ? 'selected' : ''}>Hvězdičky ⭐</option>
                        </select>
                    </div>
                    <div style="display: flex; flex-direction: column; gap: 5px; align-items: center;">
                        <span style="font-size: 0.8rem; opacity: 0.6; text-transform: uppercase; font-weight: 700; letter-spacing: 1px;">Textové pole?</span>
                        <label class="switch" style="cursor: pointer; display: flex; align-items: center; justify-content: center; height: 38px;">
                            <input type="checkbox" ${q.allowNote !== false ? 'checked' : ''} class="note-toggle" style="width: 20px; height: 20px; cursor: pointer;" onchange="this.parentElement.parentElement.parentElement.nextElementSibling.classList.toggle('hidden', !this.checked)">
                        </label>
                    </div>
                    <button onclick="this.parentElement.parentElement.remove()" 
                        style="background: rgba(229, 115, 115, 0.2); color: #e57373; border: 1px solid rgba(229, 115, 115, 0.3); border-radius: 12px; width: 45px; height: 45px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; transition: all 0.2s ease;"
                        onmouseover="this.style.background='rgba(229, 115, 115, 0.4)'"
                        onmouseout="this.style.background='rgba(229, 115, 115, 0.2)'">
                        &times;
                    </button>
                </div>
                <div class="prompts-container ${q.allowNote !== false ? '' : 'hidden'}" style="display: flex; flex-direction: column; gap: 10px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.05);">
                    <div style="display: flex; gap: 15px;">
                        <div style="flex: 1; display: flex; flex-direction: column; gap: 3px;">
                            <span style="font-size: 0.7rem; color: #81c784; opacity: 0.8; text-transform: uppercase; font-weight: 700;">Výzva po "ANO"</span>
                            <input type="text" class="yes-prompt" value="${q.yesPrompt || ''}" placeholder="Děkujeme! Jaký je váš postřeh?" style="font-size: 0.9rem;">
                        </div>
                        <div style="flex: 1; display: flex; flex-direction: column; gap: 3px;">
                            <span style="font-size: 0.7rem; color: #e57373; opacity: 0.8; text-transform: uppercase; font-weight: 700;">Výzva po "NE"</span>
                            <input type="text" class="no-prompt" value="${q.noPrompt || ''}" placeholder="Mrzí nás to. Chcete nám říct víc?" style="font-size: 0.9rem;">
                        </div>
                    </div>
                    <div style="display: flex; flex-direction: column; gap: 3px;">
                        <span style="font-size: 0.7rem; opacity: 0.5; text-transform: uppercase; font-weight: 700;">Vnitřní nápis pole (Placeholder)</span>
                        <input type="text" class="placeholder-text" value="${q.placeholder || ''}" placeholder="Vaše zpráva... (nepovinné)" style="font-size: 0.9rem; background: rgba(0,0,0,0.1);">
                    </div>
                </div>
            `;
            questionsList.appendChild(div);
        }

        async function saveQuestions() {
            const rows = document.querySelectorAll('.question-row');
            const questions = Array.from(rows).map(row => ({
                id: row.dataset.id,
                text: row.querySelector('.question-text').value,
                type: row.querySelector('.type-select').value,
                allowNote: row.querySelector('.note-toggle').checked,
                yesPrompt: row.querySelector('.yes-prompt').value,
                noPrompt: row.querySelector('.no-prompt').value,
                placeholder: row.querySelector('.placeholder-text').value
            }));

            const password = passwordInput.value;
            try {
                const response = await fetch('/api/admin/questions', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password, questions })
                });
                if (response.ok) {
                    alert('Questions saved successfully!');
                } else {
                    alert('Failed to save questions');
                }
            } catch (e) { console.error(e); }
        }

        closeModal.addEventListener('click', hideModal);
        window.addEventListener('click', (e) => { if (e.target === detailModal) hideModal() });
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') hideModal() });

        function hideModal() {
            detailModal.classList.remove('show');
        }

        async function attemptLogin() {
            const password = passwordInput.value;
            errorMsg.style.display = 'none';
            loginBtn.textContent = 'Verifying...';
            loginBtn.disabled = true;

            try {
                const response = await fetch('/api/admin/data', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });

                if (response.ok) {
                    const data = await response.json();
                    allData = data;
                    renderTable(data);
                    updateStats(data);

                    // Show Welcome State
                    loginState.classList.add('hidden');
                    const welcomeState = document.getElementById('welcomeState');
                    welcomeState.classList.remove('hidden');

                    // Delay before showing dashboard
                    setTimeout(() => {
                        welcomeState.classList.add('hidden');
                        dashboardState.classList.remove('hidden');
                        // Reset to first view
                        switchView('feedback');
                    }, 2200);
                } else {
                    const errorData = await response.json();
                    errorMsg.style.display = 'block';
                    errorMsg.textContent = errorData.error || 'Incorrect Password';
                }
            } catch (err) {
                console.error(err);
                errorMsg.style.display = 'block';
                errorMsg.textContent = 'Server Connection Error';
            } finally {
                loginBtn.textContent = 'Login';
                loginBtn.disabled = false;
            }
        }

        function renderTable(data) {
            tableBody.innerHTML = '';
            // Show newest first
            data.slice().reverse().forEach(row => {
                const tr = document.createElement('tr');
                tr.className = 'clickable';
                const note = row.note ? row.note : '<span style="opacity:0.5">-</span>';

                // Clicking the row (except the action button) shows details
                tr.onclick = (e) => {
                    if (e.target.tagName !== 'BUTTON') {
                        showDetail(row.id);
                    }
                };

                tr.innerHTML = `
                    <td>${row.date}</td>
                    <td>${row.time}</td>
                    <td><span style="color: ${row.answer === 'ANO' ? '#81c784' : '#e57373'}; font-weight:700;">${row.answer}</span></td>
                    <td>${row.couponCode ? '<span style="color: #81c784; font-weight:700;">✨ ANO</span>' : '<span style="opacity:0.4;">NE</span>'}</td>
                    <td style="max-width: 200px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;" title="${row.note || ''}">${note}</td>
                    <td>
                        <button onclick="deleteEntry('${row.id}'); event.stopPropagation();" style="padding: 6px 12px; font-size: 0.8rem; background: rgba(229,115,115,0.1); color: #e57373; border: 1px solid rgba(229,115,115,0.2); border-radius: 8px; cursor: pointer;">Smazat</button>
                    </td>
                `;
                tableBody.appendChild(tr);
            });
        }

        function renderCouponTable(coupons) {
            couponTableBody.innerHTML = '';
            coupons.forEach(row => {
                const tr = document.createElement('tr');
                const isIssued = !!row.feedbackId;
                const isUsed = row.used;

                let statusText = 'VOLNÝ';
                let statusColor = '#81c784'; // Green for available

                if (isUsed) {
                    statusText = 'POUŽITÝ';
                    statusColor = '#e57373'; // Red for used
                } else if (isIssued) {
                    statusText = 'VYDANÝ';
                    statusColor = '#ffb74d'; // Orange for issued
                }

                tr.innerHTML = `
                    <td style="font-family: monospace; letter-spacing: 2px;">${row.code}</td>
                    <td style="font-weight: 500;">${row.value || '-'}</td>
                    <td>
                        <span style="color: ${statusColor}; font-weight: 700;">
                            ${statusText}
                        </span>
                    </td>
                    <td style="display: flex; gap: 10px;">
                        <button onclick="toggleCoupon('${row.code}')" style="padding: 6px 12px; font-size: 0.8rem; background: ${isUsed ? 'rgba(255,255,255,0.1)' : '#81c784'}; color: ${isUsed ? 'white' : '#1b5e20'}; border: none; border-radius: 4px; cursor: pointer;">
                            ${isUsed ? 'Označit jako Platný' : 'Označit jako Použitý'}
                        </button>
                        ${!isIssued ? `
                            <button onclick="deleteCoupon('${row.code}')" style="padding: 6px 12px; font-size: 0.8rem; background: #e57373; color: white; border: none; border-radius: 4px; cursor: pointer;">
                                Smazat
                            </button>
                        ` : ''}
                    </td>
                `;
                couponTableBody.appendChild(tr);
            });
        }

        async function toggleCoupon(code) {
            try {
                const response = await fetch(`/api/admin/coupons/${code}/toggle`, {
                    method: 'POST'
                });

                if (response.ok) {
                    fetchCoupons(); // Refresh table
                    // Also refresh main data to keep detail modal in sync
                    const mainResponse = await fetch('/api/admin/data', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ password })
                    });
                    if (mainResponse.ok) allData = await mainResponse.json();
                    updateStats(allData);
                } else {
                    alert('Failed to toggle coupon status');
                }
            } catch (e) {
                console.error(e);
                alert('Error toggling coupon');
            }
        }

        async function addCoupon() {
            const code = newCouponCode.value.trim();
            const value = newCouponValue.value.trim();

            if (!code || !value) {
                alert('Prosím vyplňte kód i hodnotu');
                return;
            }

            try {
                const response = await fetch('/api/admin/coupons/add', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code, value })
                });

                if (response.ok) {
                    newCouponCode.value = '';
                    newCouponValue.value = '';
                    fetchCoupons();
                } else {
                    const data = await response.json();
                    alert(data.error || 'Failed to add coupon');
                }
            } catch (e) {
                console.error(e);
                alert('Error adding coupon');
            }
        }

        async function deleteCoupon(code) {
            try {
                const response = await fetch(`/api/admin/coupons/${code}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    fetchCoupons();
                } else {
                    alert('Failed to delete coupon');
                }
            } catch (e) {
                console.error(e);
                alert('Error deleting coupon');
            }
        }

        function showDetail(id) {
            const entry = allData.find(d => d.id === id);
            if (!entry) return;

            modalDateTime.textContent = `${entry.date} at ${entry.time}`;
            modalAnswer.innerHTML = `<span style="color: ${entry.answer === 'ANO' ? '#81c784' : '#e57373'}">${entry.answer}</span>`;
            modalReason.textContent = entry.note || 'No reason provided';
            modalService.textContent = entry.serviceNote || 'No service note provided';

            if (entry.couponCode) {
                modalCoupon.innerHTML = `
                    ${entry.couponCode} 
                    <span style="font-size: 0.8rem; opacity: 0.7; margin-left: 10px;">
                        (${entry.couponUsed ? 'POUŽITÝ' : 'PLATNÝ'})
                    </span>
                `;
                modalCouponContainer.style.display = 'block';
            } else {
                modalCouponContainer.style.display = 'none';
            }

            detailModal.classList.add('show');
        }

        function updateStats(data) {
            totalAnswersEl.textContent = data.length;
            const couponCount = data.filter(item => item.couponCode).length;
            totalCouponsEl.textContent = couponCount;
        }

        async function deleteEntry(id) {
            if (!confirm('Opravdu chcete smazat tuto odpověď?')) return;
            const password = passwordInput.value;
            try {
                const response = await fetch(`/api/admin/data/${id}`, {
                    method: 'DELETE',
                    headers: { 'x-admin-password': password }
                });
                if (response.ok) attemptLogin();
            } catch (e) { console.error(e); }
        }


        async function deleteAllFeedback() {
            if (!confirm('⚠️ VAROVÁNÍ: Opravdu chcete smazat ÚPLNĚ VŠECHNY odpovědi? Tato akce je nevratná.')) return;
            const password = passwordInput.value;
            try {
                const response = await fetch('/api/admin/data/all', {
                    method: 'DELETE',
                    headers: { 'x-admin-password': password }
                });
                if (response.ok) attemptLogin();
                else alert('Chyba při mazání.');
            } catch (e) { console.error(e); }
        }
    </script>
</body>

</html>
