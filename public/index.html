<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sodovkárna - Feedback</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="background-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
    </div>

    <!-- Fullscreen Welcome Screen (Attract Mode) -->
    <div id="welcomeScreen"
        style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; z-index: 100; text-align: center; padding: 20px;">
        <span
            style="font-size: 1.1rem; text-transform: uppercase; letter-spacing: 5px; opacity: 0.6; font-weight: 500; margin-bottom: 20px;">Vítejte
            v</span>
        <h1
            style="font-size: clamp(3rem, 12vw, 5.5rem); margin: 0; color: var(--accent); letter-spacing: 1px; line-height: 1; font-weight: 700;">
            Sodovkárna</h1>
        <p
            style="margin-top: 50px; font-size: 1.1rem; opacity: 0.5; font-weight: 300; max-width: 300px; line-height: 1.5;">
            Pro napsání recenze kdekoliv klikněte na obrazovku</p>
    </div>

    <main id="mainApp" class="container hidden">
        <div class="card glass" id="mainCard">
            <!-- Dynamic Questions Container -->
            <div id="questionStep">
                <h1 id="questionText">Načítání...</h1>
                <div id="yesNoButtons" class="button-group">
                    <button id="yesBtn" class="btn-yes">ANO</button>
                    <button id="noBtn" class="btn-no">NE</button>
                </div>

                <div id="noteContainer" class="hidden">
                    <p id="notePrompt" class="follow-up-text"></p>
                    <textarea id="noteInput" placeholder="Vaše zpráva... (nepovinné)" rows="3"></textarea>
                    <button id="submitNoteBtn" class="btn-primary">Pokračovat ☕️</button>
                </div>
            </div>

            <!-- Result Area -->
            <div id="resultContainer" class="result-container hidden">
                <h2 id="answerText">Děkujeme!</h2>
                <div id="couponContainer" class="coupon-container hidden">
                    <p class="coupon-label" id="couponValueLabel">Váš kupón:</p>
                    <div id="couponCode" class="coupon-code"></div>
                    <p class="screenshot-info"
                        style="font-size: 0.8rem; opacity: 0.7; margin-top: 15px; color: var(--accent);">
                        📸 Vyfoťte si tuto obrazovku pro uplatnění kupónu!
                    </p>
                </div>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>

</html>
