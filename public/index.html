<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oracle of Yes/No</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="background-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
    </div>

    <main class="container">
        <div class="card glass">
            <!-- Step 1: Coffee Question -->
            <div id="mainQuestion">
                <h1>Chutnala Vám káva? ☕️</h1>
                <div class="button-group">
                    <button id="yesBtn" class="btn-yes">ANO</button>
                    <button id="noBtn" class="btn-no">NE</button>
                </div>
            </div>

            <!-- Step 2: Reason Question (if Coffee was NE) -->
            <div id="followUpContainer" class="hidden">
                <p class="follow-up-text">Mrzí nás to. 😔 Chcete nám říct proč?</p>
                <div class="button-group small">
                    <button id="reasonYesBtn" class="btn-secondary">ANO 🖋️</button>
                    <button id="reasonNoBtn" class="btn-secondary">NE 🥐</button>
                </div>
            </div>

            <div id="reasonInputContainer" class="hidden">
                <textarea id="reasonText" placeholder="Co bylo špatně? (nepovinné) 📝" rows="3"></textarea>
                <button id="submitReasonBtn" class="btn-primary">Pokračovat ☕️</button>
            </div>

            <!-- Step 3: Service Question -->
            <div id="serviceQuestionContainer" class="hidden">
                <p class="follow-up-text">Chcete ohodnotit dnešní obsluhu? ☕️</p>
                <div class="button-group small">
                    <button id="serviceYesBtn" class="btn-secondary">ANO 🖋️</button>
                    <button id="serviceNoBtn" class="btn-secondary">NE 🍪</button>
                </div>
            </div>

            <div id="serviceInputContainer" class="hidden">
                <textarea id="serviceText" placeholder="Vaše poznámka k obsluze... (nepovinné) ✨" rows="3"></textarea>
                <button id="submitServiceBtn" class="btn-primary">Odeslat ☕️</button>
            </div>

            <div id="resultContainer" class="result-container hidden">
                <h2 id="answerText"></h2>
                <div id="couponContainer" class="coupon-container hidden">
                    <p class="coupon-label" id="couponValueLabel">Váš kupón:</p>
                    <div id="couponCode" class="coupon-code"></div>
                </div>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>

</html>
