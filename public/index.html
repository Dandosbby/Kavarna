<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oracle of Yes/No</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="background-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
    </div>

    <main class="container">
        <div class="card glass">
            <h1>Chutnala vám káva?</h1>

            <div class="button-group">
                <button id="yesBtn" class="btn-yes">ANO</button>
                <button id="noBtn" class="btn-no">NE</button>
            </div>

            <!-- Follow-up Question for Negative Feedback -->
            <div id="followUpContainer" class="hidden">
                <p class="follow-up-text">Chcete nám napsat důvod?</p>
                <div class="button-group">
                    <button id="reasonYesBtn" class="btn-yes">ANO</button>
                    <button id="reasonNoBtn" class="btn-no">NE</button>
                </div>
            </div>

            <!-- Text Input for Reason -->
            <div id="reasonInputContainer" class="hidden">
                <textarea id="reasonText" placeholder="Napište nám, co můžeme zlepšit..." rows="3"></textarea>
                <button id="submitReasonBtn" class="btn-primary">Odeslat</button>
            </div>

            <!-- Service Rating Question -->
            <div id="serviceQuestionContainer" class="hidden">
                <p class="follow-up-text">Chcete ohodnotit obsluhu?</p>
                <div class="button-group">
                    <button id="serviceYesBtn" class="btn-yes">ANO</button>
                    <button id="serviceNoBtn" class="btn-no">NE</button>
                </div>
            </div>

            <!-- Service Text Input -->
            <div id="serviceInputContainer" class="hidden">
                <textarea id="serviceText" placeholder="Napište nám svůj názor na obsluhu..." rows="3"></textarea>
                <button id="submitServiceBtn" class="btn-primary">Odeslat</button>
            </div>

            <div id="resultContainer" class="result-container hidden">
                <h2 id="answerText"></h2>
                <div id="couponContainer" class="coupon-container hidden">
                    <p class="coupon-label" id="couponValueLabel">Váš kupón:</p>
                    <div id="couponCode" class="coupon-code"></div>
                </div>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>

</html>
