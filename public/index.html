<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kavárna - Zpětná vazba</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="background-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
    </div>

    <main class="container">
        <div class="card glass">
            <!-- Dynamic Questions Container -->
            <div id="questionStep">
                <h1 id="questionText">Načítání...</h1>
                <div id="yesNoButtons" class="button-group">
                    <button id="yesBtn" class="btn-yes">ANO</button>
                    <button id="noBtn" class="btn-no">NE</button>
                </div>

                <div id="noteContainer" class="hidden">
                    <p id="notePrompt" class="follow-up-text"></p>
                    <textarea id="noteInput" placeholder="Vaše zpráva... (nepovinné)" rows="3"></textarea>
                    <button id="submitNoteBtn" class="btn-primary">Pokračovat ☕️</button>
                </div>
            </div>

            <!-- Result Area -->
            <div id="resultContainer" class="result-container hidden">
                <h2 id="answerText">Děkujeme!</h2>
                <div id="couponContainer" class="coupon-container hidden">
                    <p class="coupon-label" id="couponValueLabel">Váš kupón:</p>
                    <div id="couponCode" class="coupon-code"></div>
                    <p class="screenshot-info"
                        style="font-size: 0.9rem; opacity: 0.8; margin-top: 10px; color: var(--accent);">📸 Vyfoťte si
                        tuto obrazovku pro uplatnění kupónu!</p>
                </div>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>

</html>
